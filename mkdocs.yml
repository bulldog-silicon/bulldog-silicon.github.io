
site_name: Bulldog Silicon
site_description: Student-led Chip Design Initiative at Alabama A&M University IEEE Student Branch
site_url: https://bulldog-silicon.github.io/

theme:
  name: material
  language: en
  logo: assets/ieee-logo.png
  favicon: assets/ieee-logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.instant
  - navigation.instant.prefetch
  - content.code.copy
  - search.suggest

extra_css:
  - assets/custom.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Labs:
      - Overview: labs/index.md
      - 'Lab 0: CMOS Logic Fundamentals': 
        - Overview: labs/lab0.md
        - 'CMOS Inverter': labs/lab0/cmos-inverter.md
        - 'CMOS NAND Gate': labs/lab0/cmos-nand.md
      - 'Lab 1: Ring Oscillators':
        - Overview: labs/lab1.md
        - 'Inverter Ring Oscillator': labs/lab1/inverter-ring-oscillator.md
        - 'NAND Ring Oscillator': labs/lab1/nand-ring-oscillator.md
      - 'Lab 2: 4-Bit ALU':
        - Overview: labs/lab2.md
        - '4-Bit ALU (RTL to GDSII)': labs/lab3/4bit-alu.md
